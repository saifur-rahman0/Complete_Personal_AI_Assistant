[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-workforce-windows-agent"
version = "0.1.0"
description = "Local Windows agent worker for AI Workforce assistant"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "httpx>=0.27.0",
    "ai-workforce-contracts",
]

[tool.hatch.build.targets.wheel]
packages = ["src/windows_agent"]
