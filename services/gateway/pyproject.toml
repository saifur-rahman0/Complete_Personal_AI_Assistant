[project]
name = "gateway"
version = "0.1.0"
description = "API Gateway, WebSocket Event Streaming & Cross-Device Sync for Personal AI Assistant"
authors = [{ name = "AI Workforce Team" }]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "contracts",
]
readme = "README.md"
requires-python = ">=3.11"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
